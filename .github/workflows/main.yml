name: DailyUpdate

on:
  schedule:
    - cron: '0 */4 * * *'     # every 4 hours
  workflow_dispatch:

# Prevent two runs from racing on the push
concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: write          # REQUIRED for git push

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0       # full history avoids some push weirdness

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run filter script
        run: python3 update.py

      - name: Show output size
        run: |
          if [ -f sub.txt ]; then
            echo "sub.txt size: $(wc -c < sub.txt) bytes"
          else
            echo "::error::sub.txt was not created"; exit 1
          fi

      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add sub.txt
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto-update: $(date -u +%FT%TZ)"
            git push
          fi

      - name: Upload artifact on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-output
          path: |
            sub.txt
            *.log
          if-no-files-found: ignore
